name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject client PATs as config.js files
        run: |
          mkdir -p REDWOLF ASIS
          printf 'window.__MD_REDWOLF__ = "%s";\n' '${{ secrets.XLS_PAT }}' > REDWOLF/config.js
          printf 'window.__MD_ASIS__ = "%s";\n'    '${{ secrets.XLS_PAT }}' > ASIS/config.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
