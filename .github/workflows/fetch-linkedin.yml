name: fetch-linkedin

# Step 1a: weekly LinkedIn cache refresh for all clients.
# All paths, secret names, and shared repository lists are read from
# YML/{CLIENT}/YML-*.yml via pipeline_config.py.

on:
  schedule:
    - cron: "0 20 * * 0"   # Sunday 20:00 UTC — before the Monday batch day
  workflow_dispatch:
    inputs:
      client:
        description: 'Client to run (leave blank for all)'
        required: false
      skip_fetch:
        description: 'Skip step 1a and run only step 1b (refresh-values)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch:
    if: ${{ github.event.inputs.skip_fetch != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: ${{ (github.event.inputs.client != '' && fromJson(format('["{0}"]', github.event.inputs.client))) || fromJson('["REDWOLF","ASIS"]') }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out YML
        uses: actions/checkout@v4
        with:
          repository: jayreck996/YML
          ref: main
          path: YML
          fetch-depth: 0
          token: ${{ secrets.YML_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pyyaml
        run: pip install pyyaml -q

      - name: Load pipeline config
        id: cfg
        run: python3 .github/scripts/pipeline_config.py ${{ matrix.client }} fetch_linkedin

      - name: Check out JSON
        if: ${{ contains(format(' {0} ', steps.cfg.outputs.shared_repos), ' JSON ') }}
        uses: actions/checkout@v4
        with:
          repository: jayreck996/JSON
          ref: main
          path: JSON
          fetch-depth: 0
          token: ${{ secrets.JSON_PAT }}

      - name: Check out XLS
        if: ${{ contains(format(' {0} ', steps.cfg.outputs.shared_repos), ' XLS ') }}
        uses: actions/checkout@v4
        with:
          repository: jayreck996/XLS
          ref: main
          path: XLS
          fetch-depth: 0
          token: ${{ secrets.XLS_PAT }}

      - name: Check out JSONL
        if: ${{ contains(format(' {0} ', steps.cfg.outputs.shared_repos), ' JSONL ') }}
        uses: actions/checkout@v4
        with:
          repository: jayreck996/JSONL
          ref: main
          path: JSONL
          fetch-depth: 0
          token: ${{ secrets.JSONL_PAT }}

      - name: Fetch LinkedIn snapshots
        env:
          CLIENT: ${{ matrix.client }}
          LINKEDIN_FETCH_URL: ${{ secrets[steps.cfg.outputs.secret_linkedin_fetch_url] }}
          LISTENER_SHARED_SECRET: ${{ secrets[steps.cfg.outputs.secret_listener_shared_secret] }}
        run: python3 .github/scripts/fetch_linkedin_cache.py

      - name: Publish updated JSONL cache
        env:
          CLIENT: ${{ matrix.client }}
          JSONL_DIR: ${{ steps.cfg.outputs.jsonl_dir }}
        run: |
          bash .github/scripts/publish-changes.sh JSONL "chore(linkedin-cache): ${CLIENT} weekly snapshot" "${JSONL_DIR#JSONL/}/"

  refresh-values:
    needs: fetch
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: ${{ (github.event.inputs.client != '' && fromJson(format('["{0}"]', github.event.inputs.client))) || fromJson('["REDWOLF","ASIS"]') }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out YML
        uses: actions/checkout@v4
        with:
          repository: jayreck996/YML
          ref: main
          path: YML
          fetch-depth: 0
          token: ${{ secrets.YML_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pyyaml
        run: pip install pyyaml -q

      - name: Load pipeline config
        id: cfg
        run: python3 .github/scripts/pipeline_config.py ${{ matrix.client }} fetch_linkedin

      - name: Check out JSON
        if: ${{ contains(format(' {0} ', steps.cfg.outputs.shared_repos), ' JSON ') }}
        uses: actions/checkout@v4
        with:
          repository: jayreck996/JSON
          ref: main
          path: JSON
          fetch-depth: 0
          token: ${{ secrets.JSON_PAT }}

      - name: Check out XLS
        if: ${{ contains(format(' {0} ', steps.cfg.outputs.shared_repos), ' XLS ') }}
        uses: actions/checkout@v4
        with:
          repository: jayreck996/XLS
          ref: main
          path: XLS
          fetch-depth: 0
          token: ${{ secrets.XLS_PAT }}

      - name: Check out JSONL
        if: ${{ contains(format(' {0} ', steps.cfg.outputs.shared_repos), ' JSONL ') }}
        uses: actions/checkout@v4
        with:
          repository: jayreck996/JSONL
          ref: main
          path: JSONL
          fetch-depth: 0
          token: ${{ secrets.JSONL_PAT }}

      - name: Refresh subtype values from feedback
        env:
          CLIENT: ${{ matrix.client }}
        run: python3 .github/scripts/update_tree_values.py

      - name: Publish updated tree
        env:
          CLIENT: ${{ matrix.client }}
          JSON_FILE: ${{ steps.cfg.outputs.json }}
        run: |
          bash .github/scripts/publish-changes.sh JSON "chore(step-1b): refresh ${CLIENT} subtype values from feedback" "${JSON_FILE#JSON/}"
