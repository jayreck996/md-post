name: Generate weekly content

# Step 2: calls the Mac mini, appends 6 posts per client to XLS, opens an issue.
# All paths and secret names read from YML/{CLIENT}/YML-*.yml via pipeline_config.py.

on:
  schedule:
    - cron: '0 20 * * 1'   # Monday 20:00 UTC = Tuesday 08:00 NZST
  workflow_dispatch:
    inputs:
      client:
        description: 'Client to run (leave blank for all)'
        required: false
      week:
        description: 'ISO week number (leave blank for current week)'
        required: false
      replace:
        description: 'Replace existing rows for that week instead of appending'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: ${{ (github.event.inputs.client != '' && fromJson(format('["{0}"]', github.event.inputs.client))) || fromJson('["REDWOLF","ASIS"]') }}
    outputs:
      week: ${{ steps.week.outputs.num }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out YML
        uses: actions/checkout@v4
        with:
          repository: jayreck996/YML
          ref: main
          path: YML
          fetch-depth: 0
          token: ${{ secrets.YML_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pyyaml -q

      - name: Load pipeline config
        id: cfg
        run: python3 .github/scripts/pipeline_config.py ${{ matrix.client }} generate_content

      - name: Check out JSON
        if: ${{ contains(format(' {0} ', steps.cfg.outputs.shared_repos), ' JSON ') }}
        uses: actions/checkout@v4
        with:
          repository: jayreck996/JSON
          ref: main
          path: JSON
          fetch-depth: 0
          token: ${{ secrets.JSON_PAT }}

      - name: Check out XLS
        if: ${{ contains(format(' {0} ', steps.cfg.outputs.shared_repos), ' XLS ') }}
        uses: actions/checkout@v4
        with:
          repository: jayreck996/XLS
          ref: main
          path: XLS
          fetch-depth: 0
          token: ${{ secrets.XLS_PAT }}

      - name: Check out JSONL
        if: ${{ contains(format(' {0} ', steps.cfg.outputs.shared_repos), ' JSONL ') }}
        uses: actions/checkout@v4
        with:
          repository: jayreck996/JSONL
          ref: main
          path: JSONL
          fetch-depth: 0
          token: ${{ secrets.JSONL_PAT }}

      - name: Compute week number
        id: week
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then
            echo "num=${{ github.event.inputs.week }}" >> $GITHUB_OUTPUT
          else
            echo "num=$(python3 -c 'from datetime import date; print(date.today().isocalendar()[1])')" >> $GITHUB_OUTPUT
          fi

      - name: Refresh subtype values from feedback
        env:
          CLIENT: ${{ matrix.client }}
        run: python3 .github/scripts/update_tree_values.py

      - name: Generate posts via Mac mini
        env:
          CLIENT: ${{ matrix.client }}
          GENERATE_CONTENT_URL: ${{ secrets[steps.cfg.outputs.secret_generate_content_url] }}
          LISTENER_SHARED_SECRET: ${{ secrets[steps.cfg.outputs.secret_listener_shared_secret] }}
          CONTENT_WEEK: ${{ steps.week.outputs.num }}
          CONTENT_REPLACE: ${{ github.event.inputs.replace }}
        run: python3 .github/scripts/gen_posts.py

      - name: Publish generated posts and tree
        env:
          CLIENT: ${{ matrix.client }}
          WEEK: ${{ steps.week.outputs.num }}
          XLS_FILE: ${{ steps.cfg.outputs.xls }}
          JSON_FILE: ${{ steps.cfg.outputs.json }}
        run: |
          bash .github/scripts/publish-changes.sh XLS "content(w${WEEK}): ${CLIENT} append week ${WEEK} rows" "${XLS_FILE#XLS/}"
          bash .github/scripts/publish-changes.sh JSON "content(w${WEEK}): ${CLIENT} update tree values" "${JSON_FILE#JSON/}"

      - name: Generate issue body
        env:
          CLIENT: ${{ matrix.client }}
        run: python3 .github/scripts/gen_pr_body.py ${{ steps.week.outputs.num }} > /tmp/issue_body.md

      - name: Open issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLIENT: ${{ matrix.client }}
        run: |
          WEEK=${{ steps.week.outputs.num }}
          TITLE="content(w${WEEK}): ${CLIENT} week ${WEEK} batch"
          gh issue create --title "$TITLE" --body-file /tmp/issue_body.md
