name: Generate weekly content

# Step 2: calls the Mac mini, appends 6 posts per client to XLS, opens an issue.
# All paths and secret names read from YML/{CLIENT}/YML-*.yml via pipeline_config.py.

on:
  schedule:
    - cron: '0 20 * * 1'   # Monday 20:00 UTC = Tuesday 08:00 NZST
  workflow_dispatch:
    inputs:
      client:
        description: 'Client to run (leave blank for all)'
        required: false
      week:
        description: 'ISO week number (leave blank for current week)'
        required: false
      replace:
        description: 'Replace existing rows for that week instead of appending'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: ${{ (github.event.inputs.client != '' && fromJson(format('["{0}"]', github.event.inputs.client))) || fromJson('["REDWOLF","ASIS"]') }}
    outputs:
      week: ${{ steps.week.outputs.num }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Init YML submodule (bootstrap)
        run: |
          git config --global url."https://${{ secrets.YML_PAT }}@github.com/jayreck996/YML".insteadOf "https://github.com/jayreck996/YML"
          git submodule update --init -- YML
          git -C YML checkout -B main origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pyyaml -q

      - name: Load pipeline config
        id: cfg
        run: python3 .github/scripts/pipeline_config.py ${{ matrix.client }} generate_content

      - name: Init remaining submodules
        run: |
          git config --global url."https://${{ secrets.JSON_PAT }}@github.com/jayreck996/JSON".insteadOf "https://github.com/jayreck996/JSON"
          git config --global url."https://${{ secrets.XLS_PAT }}@github.com/jayreck996/XLS".insteadOf "https://github.com/jayreck996/XLS"
          git config --global url."https://${{ secrets.JSONL_PAT }}@github.com/jayreck996/JSONL".insteadOf "https://github.com/jayreck996/JSONL"
          REMAINING=$(echo "${{ steps.cfg.outputs.submodules }}" | tr ' ' '\n' | grep -v '^YML$' | tr '\n' ' ')
          git submodule update --init -- $REMAINING
          for sub in $REMAINING; do git -C $sub checkout -B main origin/main; done

      - name: Compute week number
        id: week
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then
            echo "num=${{ github.event.inputs.week }}" >> $GITHUB_OUTPUT
          else
            echo "num=$(python3 -c 'from datetime import date; print(date.today().isocalendar()[1])')" >> $GITHUB_OUTPUT
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Refresh subtype values from feedback
        env:
          CLIENT: ${{ matrix.client }}
        run: python3 .github/scripts/update_tree_values.py

      - name: Generate posts via Mac mini
        env:
          CLIENT: ${{ matrix.client }}
          GENERATE_CONTENT_URL: ${{ secrets[steps.cfg.outputs.secret_generate_content_url] }}
          LISTENER_SHARED_SECRET: ${{ secrets[steps.cfg.outputs.secret_listener_shared_secret] }}
          CONTENT_WEEK: ${{ steps.week.outputs.num }}
          CONTENT_REPLACE: ${{ github.event.inputs.replace }}
        run: python3 .github/scripts/gen_posts.py

      - name: Commit generated posts
        run: |
          CLIENT=${{ matrix.client }}
          WEEK=${{ steps.week.outputs.num }}
          XLS_FILE=${{ steps.cfg.outputs.xls }}
          JSON_FILE=${{ steps.cfg.outputs.json }}
          RANGE=$(python3 -c "
          import csv
          rows = list(csv.DictReader(open('${XLS_FILE}')))
          week_rows = [r for r in rows if r['week'] == '${WEEK}']
          if week_rows:
              items = [r['item'] for r in week_rows]
              print(f'{items[0]} to {items[-1]}')
          else:
              print('no posts')
          ")
          BOT_NAME="github-actions[bot]"
          BOT_EMAIL="github-actions[bot]@users.noreply.github.com"
          cd XLS
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add -- "${XLS_FILE#XLS/}"
          if ! git diff --cached --quiet; then
            git commit -m "content(w${WEEK}): ${CLIENT} append week ${WEEK} rows"
            for attempt in 1 2 3 4 5; do
              if git push; then break; fi
              git fetch origin main && git rebase origin/main
            done
          fi
          cd ..
          cd JSON
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add -- "${JSON_FILE#JSON/}"
          if ! git diff --cached --quiet; then
            git commit -m "content(w${WEEK}): ${CLIENT} update tree values"
            for attempt in 1 2 3 4 5; do
              if git push; then break; fi
              git fetch origin main && git rebase origin/main
            done
          fi
          cd ..
          git add XLS JSON
          git commit -m "content(w${WEEK}): ${CLIENT} generate week ${WEEK} batch — ${RANGE}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            sleep 5
          done

      - name: Generate issue body
        env:
          CLIENT: ${{ matrix.client }}
        run: python3 .github/scripts/gen_pr_body.py ${{ steps.week.outputs.num }} > /tmp/issue_body.md

      - name: Open issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLIENT: ${{ matrix.client }}
        run: |
          WEEK=${{ steps.week.outputs.num }}
          TITLE="content(w${WEEK}): ${CLIENT} week ${WEEK} batch"
          gh issue create --title "$TITLE" --body-file /tmp/issue_body.md
