name: Generate weekly media

# Step 2D: triggers the Mac mini /generate-media endpoint.
# Media output mode (submodule vs repo_local) and all paths are read from
# YML/{CLIENT}/YML-*.yml via pipeline_config.py.

on:
  workflow_dispatch:
    inputs:
      client:
        description: 'Client to run (leave blank for all)'
        required: false
      week:
        description: 'ISO week number (leave blank for current week)'
        required: false

permissions:
  contents: write

jobs:
  generate-media:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: ${{ (github.event.inputs.client != '' && fromJson(format('["{0}"]', github.event.inputs.client))) || fromJson('["REDWOLF","ASIS"]') }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Init YML submodule (bootstrap)
        run: |
          git config --global url."https://${{ secrets.YML_PAT }}@github.com/jayreck996/YML".insteadOf "https://github.com/jayreck996/YML"
          git submodule update --init --checkout -- YML
          git -C YML checkout -B main origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pyyaml -q

      - name: Load pipeline config
        id: cfg
        run: python3 .github/scripts/pipeline_config.py ${{ matrix.client }} generate_media

      - name: Init remaining submodules
        run: |
          git config --global url."https://${{ secrets.JSON_PAT }}@github.com/jayreck996/JSON".insteadOf "https://github.com/jayreck996/JSON"
          git config --global url."https://${{ secrets.XLS_PAT }}@github.com/jayreck996/XLS".insteadOf "https://github.com/jayreck996/XLS"
          git config --global url."https://${{ secrets.JSONL_PAT }}@github.com/jayreck996/JSONL".insteadOf "https://github.com/jayreck996/JSONL"
          git config --global url."https://${{ secrets.IMG_PAT }}@github.com/jayreck996/IMG".insteadOf "https://github.com/jayreck996/IMG" || true
          git config --global url."https://${{ secrets.PDF_PAT }}@github.com/jayreck996/PDF".insteadOf "https://github.com/jayreck996/PDF" || true
          REMAINING=$(echo "${{ steps.cfg.outputs.submodules }}" | tr ' ' '\n' | grep -v '^YML$' | tr '\n' ' ')
          git submodule update --init --checkout -- $REMAINING
          for sub in $REMAINING; do git -C $sub checkout -B main origin/main; done

      - name: Compute week number
        id: week
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then
            echo "num=${{ github.event.inputs.week }}" >> $GITHUB_OUTPUT
          else
            echo "num=$(python3 -c 'from datetime import date; print(date.today().isocalendar()[1])')" >> $GITHUB_OUTPUT
          fi

      - name: Generate media via Mac mini
        env:
          CLIENT: ${{ matrix.client }}
          GENERATE_CONTENT_URL: ${{ secrets[steps.cfg.outputs.secret_generate_content_url] }}
          LISTENER_SHARED_SECRET: ${{ secrets[steps.cfg.outputs.secret_listener_shared_secret] }}
          CONTENT_WEEK: ${{ steps.week.outputs.num }}
          MEDIA_MODE:  ${{ steps.cfg.outputs.media_mode }}
          XLS_PATH:    ${{ steps.cfg.outputs.xls }}
          LOGO_PATH:   ${{ steps.cfg.outputs.logo }}
          LOGO_MIME:   ${{ steps.cfg.outputs.logo_mime }}
          SKILL_PATH:  ${{ steps.cfg.outputs.skill_generate_media }}
          IMG_DIR:     ${{ steps.cfg.outputs.img_dir }}
          PDF_DIR:     ${{ steps.cfg.outputs.pdf_dir }}
          IMG_BASE:    ${{ steps.cfg.outputs.img_base }}
          PDF_BASE:    ${{ steps.cfg.outputs.pdf_base }}
          MEDIA_DIR:   ${{ steps.cfg.outputs.media_dir }}
          PAGES_BASE:  ${{ steps.cfg.outputs.pages_base }}
        run: python3 .github/scripts/gen_media.py

      - name: Commit media (submodule mode)
        if: ${{ steps.cfg.outputs.media_mode == 'submodule' }}
        run: |
          WEEK=${{ steps.week.outputs.num }}
          CLIENT=${{ matrix.client }}
          XLS_FILE=${{ steps.cfg.outputs.xls }}
          BOT_NAME="github-actions[bot]"
          BOT_EMAIL="github-actions[bot]@users.noreply.github.com"
          cd IMG
          git config user.name "$BOT_NAME"; git config user.email "$BOT_EMAIL"
          git add -- "${CLIENT}/"
          if ! git diff --cached --quiet; then
            git commit -m "media(w${WEEK}): ${CLIENT} week ${WEEK} images"
            for attempt in 1 2 3 4 5; do
              if git push; then break; fi
              git fetch origin main && git rebase origin/main
            done
          fi
          cd ..
          cd PDF
          git config user.name "$BOT_NAME"; git config user.email "$BOT_EMAIL"
          git add -- "${CLIENT}/"
          if ! git diff --cached --quiet; then
            git commit -m "media(w${WEEK}): ${CLIENT} week ${WEEK} PDFs"
            for attempt in 1 2 3 4 5; do
              if git push; then break; fi
              git fetch origin main && git rebase origin/main
            done
          fi
          cd ..
          cd XLS
          git config user.name "$BOT_NAME"; git config user.email "$BOT_EMAIL"
          git add -- "${XLS_FILE#XLS/}"
          if ! git diff --cached --quiet; then
            git commit -m "media(w${WEEK}): ${CLIENT} update media URLs"
            for attempt in 1 2 3 4 5; do
              if git push; then break; fi
              git fetch origin main && git rebase origin/main
            done
          fi
          cd ..
          git add IMG PDF XLS
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git config user.name "$BOT_NAME"; git config user.email "$BOT_EMAIL"
          git commit -m "media(w${WEEK}): ${CLIENT} week ${WEEK} assets"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then break; fi
            git fetch origin main && git rebase origin/main
          done

      - name: Commit media (repo_local mode)
        if: ${{ steps.cfg.outputs.media_mode == 'repo_local' }}
        run: |
          WEEK=${{ steps.week.outputs.num }}
          CLIENT=${{ matrix.client }}
          XLS_FILE=${{ steps.cfg.outputs.xls }}
          MEDIA_DIR=${{ steps.cfg.outputs.media_dir }}
          BOT_NAME="github-actions[bot]"
          BOT_EMAIL="github-actions[bot]@users.noreply.github.com"
          cd XLS
          git config user.name "$BOT_NAME"; git config user.email "$BOT_EMAIL"
          git add -- "${XLS_FILE#XLS/}"
          if ! git diff --cached --quiet; then
            git commit -m "media(w${WEEK}): ${CLIENT} update media URLs"
            for attempt in 1 2 3 4 5; do
              if git push; then break; fi
              git fetch origin main && git rebase origin/main
            done
          fi
          cd ..
          git add "${MEDIA_DIR}/" XLS
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git config user.name "$BOT_NAME"; git config user.email "$BOT_EMAIL"
          git commit -m "media(w${WEEK}): ${CLIENT} week ${WEEK} assets"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then break; fi
            git fetch origin main && git rebase origin/main
          done
