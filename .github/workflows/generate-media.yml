name: Generate weekly media

# Step 2D: triggers the Mac mini /generate-media endpoint.
# Media output mode (submodule vs repo_local) and all paths are read from
# YML/{CLIENT}/YML-*.yml via pipeline_config.py.

on:
  workflow_dispatch:
    inputs:
      client:
        description: 'Client to run (leave blank for all)'
        required: false
      week:
        description: 'ISO week number (leave blank for current week)'
        required: false

permissions:
  contents: write

jobs:
  generate-media:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: ${{ (github.event.inputs.client != '' && fromJson(format('["{0}"]', github.event.inputs.client))) || fromJson('["REDWOLF","ASIS"]') }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out YML
        uses: actions/checkout@v4
        with:
          repository: jayreck996/YML
          ref: main
          path: YML
          fetch-depth: 0
          token: ${{ secrets.YML_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pyyaml -q

      - name: Load pipeline config
        id: cfg
        run: python3 .github/scripts/pipeline_config.py ${{ matrix.client }} generate_media

      - name: Check out JSON
        if: ${{ contains(format(' {0} ', steps.cfg.outputs.shared_repos), ' JSON ') }}
        uses: actions/checkout@v4
        with:
          repository: jayreck996/JSON
          ref: main
          path: JSON
          fetch-depth: 0
          token: ${{ secrets.JSON_PAT }}

      - name: Check out XLS
        if: ${{ contains(format(' {0} ', steps.cfg.outputs.shared_repos), ' XLS ') }}
        uses: actions/checkout@v4
        with:
          repository: jayreck996/XLS
          ref: main
          path: XLS
          fetch-depth: 0
          token: ${{ secrets.XLS_PAT }}

      - name: Check out JSONL
        if: ${{ contains(format(' {0} ', steps.cfg.outputs.shared_repos), ' JSONL ') }}
        uses: actions/checkout@v4
        with:
          repository: jayreck996/JSONL
          ref: main
          path: JSONL
          fetch-depth: 0
          token: ${{ secrets.JSONL_PAT }}

      - name: Check out IMG
        if: ${{ contains(format(' {0} ', steps.cfg.outputs.shared_repos), ' IMG ') }}
        uses: actions/checkout@v4
        with:
          repository: jayreck996/IMG
          ref: main
          path: IMG
          fetch-depth: 0
          token: ${{ secrets.IMG_PAT }}

      - name: Check out PDF
        if: ${{ contains(format(' {0} ', steps.cfg.outputs.shared_repos), ' PDF ') }}
        uses: actions/checkout@v4
        with:
          repository: jayreck996/PDF
          ref: main
          path: PDF
          fetch-depth: 0
          token: ${{ secrets.PDF_PAT }}

      - name: Compute week number
        id: week
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then
            echo "num=${{ github.event.inputs.week }}" >> $GITHUB_OUTPUT
          else
            echo "num=$(python3 -c 'from datetime import date; print(date.today().isocalendar()[1])')" >> $GITHUB_OUTPUT
          fi

      - name: Generate media via Mac mini
        env:
          CLIENT: ${{ matrix.client }}
          GENERATE_CONTENT_URL: ${{ secrets[steps.cfg.outputs.secret_generate_content_url] }}
          LISTENER_SHARED_SECRET: ${{ secrets[steps.cfg.outputs.secret_listener_shared_secret] }}
          CONTENT_WEEK: ${{ steps.week.outputs.num }}
          MEDIA_MODE:  ${{ steps.cfg.outputs.media_mode }}
          XLS_PATH:    ${{ steps.cfg.outputs.xls }}
          LOGO_PATH:   ${{ steps.cfg.outputs.logo }}
          LOGO_MIME:   ${{ steps.cfg.outputs.logo_mime }}
          SKILL_PATH:  ${{ steps.cfg.outputs.skill_generate_media }}
          IMG_DIR:     ${{ steps.cfg.outputs.img_dir }}
          PDF_DIR:     ${{ steps.cfg.outputs.pdf_dir }}
          IMG_BASE:    ${{ steps.cfg.outputs.img_base }}
          PDF_BASE:    ${{ steps.cfg.outputs.pdf_base }}
          MEDIA_DIR:   ${{ steps.cfg.outputs.media_dir }}
          PAGES_BASE:  ${{ steps.cfg.outputs.pages_base }}
        run: python3 .github/scripts/gen_media.py

      - name: Publish media in shared repositories
        if: ${{ steps.cfg.outputs.media_mode == 'submodule' }}
        env:
          CLIENT: ${{ matrix.client }}
          WEEK: ${{ steps.week.outputs.num }}
        run: |
          bash .github/scripts/publish-changes.sh IMG "media(w${WEEK}): ${CLIENT} week ${WEEK} images" "${CLIENT}/"
          bash .github/scripts/publish-changes.sh PDF "media(w${WEEK}): ${CLIENT} week ${WEEK} PDFs" "${CLIENT}/"

      - name: Publish media in md-post
        if: ${{ steps.cfg.outputs.media_mode == 'repo_local' }}
        env:
          CLIENT: ${{ matrix.client }}
          WEEK: ${{ steps.week.outputs.num }}
          MEDIA_DIR: ${{ steps.cfg.outputs.media_dir }}
        run: |
          bash .github/scripts/publish-changes.sh . "media(w${WEEK}): ${CLIENT} week ${WEEK} assets" "${MEDIA_DIR}/"

      - name: Publish media URLs
        env:
          CLIENT: ${{ matrix.client }}
          WEEK: ${{ steps.week.outputs.num }}
          XLS_FILE: ${{ steps.cfg.outputs.xls }}
        run: |
          bash .github/scripts/publish-changes.sh XLS "media(w${WEEK}): ${CLIENT} update media URLs" "${XLS_FILE#XLS/}"
