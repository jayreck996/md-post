name: Generate weekly media

# Step 2D: triggers the Mac mini /generate-media endpoint.
# Media repositories and all paths are read from
# YML/{CLIENT}/YML-*.yml via pipeline_config.py.

on:
  workflow_dispatch:
    inputs:
      client:
        description: 'Client to run (leave blank for all)'
        required: false
      week:
        description: 'ISO week number (leave blank for current week)'
        required: false

permissions:
  contents: write

jobs:
  generate-media:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: ${{ (github.event.inputs.client != '' && fromJson(format('["{0}"]', github.event.inputs.client))) || fromJson('["REDWOLF","ASIS"]') }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out YML
        uses: actions/checkout@v4
        with:
          repository: jayreck996/YML
          ref: main
          path: YML
          fetch-depth: 0
          token: ${{ secrets.YML_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pyyaml -q

      - name: Load pipeline config
        id: cfg
        run: python3 .github/scripts/pipeline_config.py ${{ matrix.client }} generate_media

      - name: Check out JSON
        if: ${{ contains(format(' {0} ', steps.cfg.outputs.required_repositories), ' json ') }}
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.cfg.outputs.json_repository }}
          ref: main
          path: ${{ steps.cfg.outputs.json_checkout_path }}
          fetch-depth: 0
          token: ${{ secrets.JSON_PAT }}

      - name: Check out XLS
        if: ${{ contains(format(' {0} ', steps.cfg.outputs.required_repositories), ' xls ') }}
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.cfg.outputs.xls_repository }}
          ref: main
          path: ${{ steps.cfg.outputs.xls_checkout_path }}
          fetch-depth: 0
          token: ${{ secrets.XLS_PAT }}

      - name: Check out JSONL
        if: ${{ contains(format(' {0} ', steps.cfg.outputs.required_repositories), ' jsonl ') }}
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.cfg.outputs.jsonl_repository }}
          ref: main
          path: ${{ steps.cfg.outputs.jsonl_checkout_path }}
          fetch-depth: 0
          token: ${{ secrets.JSONL_PAT }}

      - name: Check out IMG
        if: ${{ contains(format(' {0} ', steps.cfg.outputs.required_repositories), ' img ') }}
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.cfg.outputs.img_repository }}
          ref: main
          path: ${{ steps.cfg.outputs.img_checkout_path }}
          fetch-depth: 0
          token: ${{ secrets.IMG_PAT }}

      - name: Check out PDF
        if: ${{ contains(format(' {0} ', steps.cfg.outputs.required_repositories), ' pdf ') }}
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.cfg.outputs.pdf_repository }}
          ref: main
          path: ${{ steps.cfg.outputs.pdf_checkout_path }}
          fetch-depth: 0
          token: ${{ secrets.PDF_PAT }}

      - name: Compute week number
        id: week
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then
            echo "num=${{ github.event.inputs.week }}" >> $GITHUB_OUTPUT
          else
            echo "num=$(python3 -c 'from datetime import date; print(date.today().isocalendar()[1])')" >> $GITHUB_OUTPUT
          fi

      - name: Generate media via Mac mini
        env:
          CLIENT: ${{ matrix.client }}
          GENERATE_CONTENT_URL: ${{ secrets[steps.cfg.outputs.secret_generate_content_url] }}
          LISTENER_SHARED_SECRET: ${{ secrets[steps.cfg.outputs.secret_listener_shared_secret] }}
          CONTENT_WEEK: ${{ steps.week.outputs.num }}
          MEDIA_MODE:  ${{ steps.cfg.outputs.media_mode }}
          XLS_PATH:    ${{ steps.cfg.outputs.posts_path }}
          LOGO_PATH:   ${{ steps.cfg.outputs.logo_path }}
          LOGO_MIME:   ${{ steps.cfg.outputs.logo_mime }}
          SKILL_PATH:  ${{ steps.cfg.outputs.generate_media_skill_path }}
          IMAGE_DIR:   ${{ steps.cfg.outputs.image_dir }}
          DOCUMENT_DIR: ${{ steps.cfg.outputs.document_dir }}
          IMAGE_BASE_URL: ${{ steps.cfg.outputs.image_base_url }}
          DOCUMENT_BASE_URL: ${{ steps.cfg.outputs.document_base_url }}
        run: python3 .github/scripts/gen_media.py

      - name: Publish media in shared repositories
        if: ${{ steps.cfg.outputs.media_mode == 'shared_repositories' }}
        env:
          CLIENT: ${{ matrix.client }}
          WEEK: ${{ steps.week.outputs.num }}
        run: |
          bash .github/scripts/publish-changes.sh IMG "media(w${WEEK}): ${CLIENT} week ${WEEK} images" "${CLIENT}/"
          bash .github/scripts/publish-changes.sh PDF "media(w${WEEK}): ${CLIENT} week ${WEEK} PDFs" "${CLIENT}/"

      - name: Publish media URLs
        env:
          CLIENT: ${{ matrix.client }}
          WEEK: ${{ steps.week.outputs.num }}
          POSTS_PATH: ${{ steps.cfg.outputs.posts_path }}
        run: |
          bash .github/scripts/publish-changes.sh XLS "media(w${WEEK}): ${CLIENT} update media URLs" "${POSTS_PATH#XLS/}"
