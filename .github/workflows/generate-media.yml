name: Generate weekly media

# Step 2D: triggers the Mac mini /generate-media endpoint for posts in the
# target week that have an empty media URL.
# REDWOLF writes to IMG/PDF submodules; ASIS writes to MAY/media/2026Q3/ (repo-local).
#
# Requires shared secrets:
#   GENERATE_CONTENT_URL, CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET,
#   LISTENER_SHARED_SECRET
# REDWOLF also requires: IMG_PAT, PDF_PAT
# Submodule PATs: JSON_PAT, XLS_PAT, YML_PAT, JSONL_PAT

on:
  workflow_dispatch:
    inputs:
      client:
        description: 'Client to run (leave blank for all)'
        required: false
      week:
        description: 'ISO week number (leave blank for current week)'
        required: false

permissions:
  contents: write

jobs:
  generate-media-redwolf:
    if: ${{ github.event.inputs.client == '' || github.event.inputs.client == 'REDWOLF' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialise submodules
        run: |
          git config --global url."https://${{ secrets.JSON_PAT }}@github.com/jayreck996/JSON".insteadOf "https://github.com/jayreck996/JSON"
          git config --global url."https://${{ secrets.XLS_PAT }}@github.com/jayreck996/XLS".insteadOf "https://github.com/jayreck996/XLS"
          git config --global url."https://${{ secrets.YML_PAT }}@github.com/jayreck996/YML".insteadOf "https://github.com/jayreck996/YML"
          git config --global url."https://${{ secrets.JSONL_PAT }}@github.com/jayreck996/JSONL".insteadOf "https://github.com/jayreck996/JSONL"
          git config --global url."https://${{ secrets.IMG_PAT }}@github.com/jayreck996/IMG".insteadOf "https://github.com/jayreck996/IMG"
          git config --global url."https://${{ secrets.PDF_PAT }}@github.com/jayreck996/PDF".insteadOf "https://github.com/jayreck996/PDF"
          git submodule update --init -- XLS JSON YML JSONL IMG PDF
          git -C JSON  checkout -B main origin/main
          git -C XLS   checkout -B main origin/main
          git -C YML   checkout -B main origin/main
          git -C JSONL checkout -B main origin/main
          git -C IMG   checkout -B main origin/main
          git -C PDF   checkout -B main origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Compute week number
        id: week
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then
            echo "num=${{ github.event.inputs.week }}" >> $GITHUB_OUTPUT
          else
            echo "num=$(python3 -c 'from datetime import date; print(date.today().isocalendar()[1])')" >> $GITHUB_OUTPUT
          fi

      - name: Generate REDWOLF media via Mac mini
        env:
          GENERATE_CONTENT_URL: ${{ secrets.GENERATE_CONTENT_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          LISTENER_SHARED_SECRET: ${{ secrets.LISTENER_SHARED_SECRET }}
          CONTENT_WEEK: ${{ steps.week.outputs.num }}
        run: python3 .github/scripts/gen_media_REDWOLF.py

      - name: Commit REDWOLF media
        run: |
          WEEK=${{ steps.week.outputs.num }}
          BOT_NAME="github-actions[bot]"
          BOT_EMAIL="github-actions[bot]@users.noreply.github.com"
          cd IMG
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add -- REDWOLF/
          if ! git diff --cached --quiet; then
            git commit -m "media(w${WEEK}): REDWOLF week ${WEEK} images"
            for attempt in 1 2 3 4 5; do
              if git push; then break; fi
              echo "IMG push rejected (attempt $attempt) -- rebasing..."
              git fetch origin main && git rebase origin/main
            done
          fi
          cd ..
          cd PDF
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add -- REDWOLF/
          if ! git diff --cached --quiet; then
            git commit -m "media(w${WEEK}): REDWOLF week ${WEEK} PDFs"
            for attempt in 1 2 3 4 5; do
              if git push; then break; fi
              echo "PDF push rejected (attempt $attempt) -- rebasing..."
              git fetch origin main && git rebase origin/main
            done
          fi
          cd ..
          cd XLS
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add -- REDWOLF/XLS-2026Q4.xls
          if ! git diff --cached --quiet; then
            git commit -m "media(w${WEEK}): REDWOLF update media URLs"
            for attempt in 1 2 3 4 5; do
              if git push; then break; fi
              echo "XLS push rejected (attempt $attempt) -- rebasing..."
              git fetch origin main && git rebase origin/main
            done
          fi
          cd ..
          git add IMG PDF XLS
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git commit -m "media(w${WEEK}): REDWOLF week ${WEEK} assets"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then break; fi
            echo "parent push rejected (attempt $attempt) -- rebasing..."
            git fetch origin main && git rebase origin/main
          done

  generate-media-asis:
    if: ${{ github.event.inputs.client == '' || github.event.inputs.client == 'ASIS' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialise submodules
        run: |
          git config --global url."https://${{ secrets.JSON_PAT }}@github.com/jayreck996/JSON".insteadOf "https://github.com/jayreck996/JSON"
          git config --global url."https://${{ secrets.XLS_PAT }}@github.com/jayreck996/XLS".insteadOf "https://github.com/jayreck996/XLS"
          git config --global url."https://${{ secrets.YML_PAT }}@github.com/jayreck996/YML".insteadOf "https://github.com/jayreck996/YML"
          git config --global url."https://${{ secrets.JSONL_PAT }}@github.com/jayreck996/JSONL".insteadOf "https://github.com/jayreck996/JSONL"
          git submodule update --init -- XLS JSON YML JSONL
          git -C JSON  checkout -B main origin/main
          git -C XLS   checkout -B main origin/main
          git -C YML   checkout -B main origin/main
          git -C JSONL checkout -B main origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Compute week number
        id: week
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then
            echo "num=${{ github.event.inputs.week }}" >> $GITHUB_OUTPUT
          else
            echo "num=$(python3 -c 'from datetime import date; print(date.today().isocalendar()[1])')" >> $GITHUB_OUTPUT
          fi

      - name: Generate ASIS media via Mac mini
        env:
          GENERATE_CONTENT_URL: ${{ secrets.GENERATE_CONTENT_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          LISTENER_SHARED_SECRET: ${{ secrets.LISTENER_SHARED_SECRET }}
          CONTENT_WEEK: ${{ steps.week.outputs.num }}
        run: python3 .github/scripts/gen_media_ASIS.py

      - name: Commit ASIS media
        run: |
          WEEK=${{ steps.week.outputs.num }}
          BOT_NAME="github-actions[bot]"
          BOT_EMAIL="github-actions[bot]@users.noreply.github.com"
          # ASIS writes to repo-local MAY/media/ — no IMG/PDF submodule commits needed
          cd XLS
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add -- ASIS/XLS-2026Q4.xls
          if ! git diff --cached --quiet; then
            git commit -m "media(w${WEEK}): ASIS update media URLs"
            for attempt in 1 2 3 4 5; do
              if git push; then break; fi
              echo "XLS push rejected (attempt $attempt) -- rebasing..."
              git fetch origin main && git rebase origin/main
            done
          fi
          cd ..
          git add MAY/media/ XLS
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git commit -m "media(w${WEEK}): ASIS week ${WEEK} assets"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then break; fi
            echo "parent push rejected (attempt $attempt) -- rebasing..."
            git fetch origin main && git rebase origin/main
          done
