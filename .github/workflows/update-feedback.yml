name: Update client feedback

# Triggered by repository_dispatch from the review UI.
# XLS path read from YML/{CLIENT}/YML.yml via pipeline_config.py.
#
# Expected payload fields:
#   client   — "REDWOLF" or "ASIS" (defaults to "REDWOLF" if absent)
#   post_id  — item identifier, e.g. "post-042"
#   result   — "win", "tie", "lost", or "" (clear)
#   comment  — optional free-text comment

on:
  repository_dispatch:
    types: [client-feedback]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out YML
        uses: actions/checkout@v4
        with:
          repository: jayreck996/YML
          ref: main
          path: YML
          fetch-depth: 0
          token: ${{ secrets.YML_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pyyaml
        run: pip install pyyaml -q

      - name: Load pipeline config
        id: cfg
        run: python3 .github/scripts/pipeline_config.py ${{ github.event.client_payload.client || 'REDWOLF' }} update_feedback

      - name: Check out JSON
        if: ${{ contains(format(' {0} ', steps.cfg.outputs.required_repositories), ' json ') }}
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.cfg.outputs.json_repository }}
          ref: main
          path: ${{ steps.cfg.outputs.json_checkout_path }}
          fetch-depth: 0
          token: ${{ secrets.JSON_PAT }}

      - name: Check out XLS
        if: ${{ contains(format(' {0} ', steps.cfg.outputs.required_repositories), ' xls ') }}
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.cfg.outputs.xls_repository }}
          ref: main
          path: ${{ steps.cfg.outputs.xls_checkout_path }}
          fetch-depth: 0
          token: ${{ secrets.XLS_PAT }}

      - name: Check out JSONL
        if: ${{ contains(format(' {0} ', steps.cfg.outputs.required_repositories), ' jsonl ') }}
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.cfg.outputs.jsonl_repository }}
          ref: main
          path: ${{ steps.cfg.outputs.jsonl_checkout_path }}
          fetch-depth: 0
          token: ${{ secrets.JSONL_PAT }}

      - name: Update feedback in XLS
        env:
          XLS_PATH: ${{ steps.cfg.outputs.posts_path }}
          CLIENT:   ${{ github.event.client_payload.client || 'REDWOLF' }}
          POST_ID:  ${{ github.event.client_payload.post_id }}
          RESULT:   ${{ github.event.client_payload.result }}
          COMMENT:  ${{ github.event.client_payload.comment }}
        run: |
          python3 - <<'EOF'
          import csv, os, sys

          xls_path = os.environ["XLS_PATH"]
          client   = os.environ.get("CLIENT", "REDWOLF").upper()
          post_id  = os.environ["POST_ID"]
          result   = os.environ["RESULT"]
          comment  = os.environ.get("COMMENT", "")

          if result not in ("win", "tie", "lost", ""):
              print(f"Invalid result: {result}")
              sys.exit(1)

          rows = []
          with open(xls_path, newline="", encoding="utf-8") as f:
              reader = csv.DictReader(f)
              fieldnames = list(reader.fieldnames)
              if "feedback" not in fieldnames:
                  fieldnames.append("feedback")
              if "feedback-comment" not in fieldnames:
                  fieldnames.append("feedback-comment")
              for row in reader:
                  if row["item"] == post_id:
                      row["feedback"] = result
                      row["feedback-comment"] = comment
                  rows.append(row)

          with open(xls_path, "w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames, quoting=csv.QUOTE_ALL)
              writer.writeheader()
              writer.writerows(rows)

          print(f"[{client}] XLS: {post_id} -> {result} (comment: {comment!r})")
          EOF

      - name: Publish feedback
        env:
          CLIENT: ${{ github.event.client_payload.client || 'REDWOLF' }}
          POST_ID: ${{ github.event.client_payload.post_id }}
          RESULT: ${{ github.event.client_payload.result }}
          POSTS_PATH: ${{ steps.cfg.outputs.posts_path }}
        run: |
          bash .github/scripts/publish-changes.sh XLS "feedback: ${POST_ID} -> ${RESULT} (${CLIENT})" "${POSTS_PATH#XLS/}"
