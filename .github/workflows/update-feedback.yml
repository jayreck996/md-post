name: Update client feedback

# Triggered by repository_dispatch from the review UI when a reviewer submits
# win / tie / lost feedback on a post.
#
# Expected payload fields:
#   client   — "REDWOLF" or "ASIS" (defaults to "REDWOLF" if absent for compatibility)
#   post_id  — item identifier, e.g. "post-042"
#   result   — "win", "tie", "lost", or "" (clear feedback)
#   comment  — optional free-text comment

on:
  repository_dispatch:
    types: [client-feedback]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialise submodules
        run: |
          git config --global url."https://${{ secrets.JSON_PAT }}@github.com/jayreck996/JSON".insteadOf "https://github.com/jayreck996/JSON"
          git config --global url."https://${{ secrets.XLS_PAT }}@github.com/jayreck996/XLS".insteadOf "https://github.com/jayreck996/XLS"
          git config --global url."https://${{ secrets.YML_PAT }}@github.com/jayreck996/YML".insteadOf "https://github.com/jayreck996/YML"
          git config --global url."https://${{ secrets.JSONL_PAT }}@github.com/jayreck996/JSONL".insteadOf "https://github.com/jayreck996/JSONL"
          git submodule update --init -- XLS JSON YML JSONL
          git -C JSON  checkout -B main origin/main
          git -C XLS   checkout -B main origin/main
          git -C YML   checkout -B main origin/main
          git -C JSONL checkout -B main origin/main

      - name: Update feedback in XLS
        env:
          CLIENT:  ${{ github.event.client_payload.client || 'REDWOLF' }}
          POST_ID: ${{ github.event.client_payload.post_id }}
          RESULT:  ${{ github.event.client_payload.result }}
          COMMENT: ${{ github.event.client_payload.comment }}
        run: |
          python3 - <<'EOF'
          import csv, os, sys

          client   = os.environ.get("CLIENT", "REDWOLF").upper()
          post_id  = os.environ["POST_ID"]
          result   = os.environ["RESULT"]
          comment  = os.environ.get("COMMENT", "")
          csv_path = f"XLS/{client}/XLS-2026Q4.xls"

          if result not in ("win", "tie", "lost", ""):
              print(f"Invalid result: {result}")
              sys.exit(1)

          rows = []
          with open(csv_path, newline="", encoding="utf-8") as f:
              reader = csv.DictReader(f)
              fieldnames = list(reader.fieldnames)
              if "feedback" not in fieldnames:
                  fieldnames.append("feedback")
              if "feedback-comment" not in fieldnames:
                  fieldnames.append("feedback-comment")
              for row in reader:
                  if row["item"] == post_id:
                      row["feedback"] = result
                      row["feedback-comment"] = comment
                  rows.append(row)

          with open(csv_path, "w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames, quoting=csv.QUOTE_ALL)
              writer.writeheader()
              writer.writerows(rows)

          print(f"[{client}] XLS: {post_id} -> {result} (comment: {comment!r})")
          EOF

      - name: Commit and push
        run: |
          CLIENT=${{ github.event.client_payload.client || 'REDWOLF' }}
          BOT_NAME="github-actions[bot]"
          BOT_EMAIL="github-actions[bot]@users.noreply.github.com"
          cd XLS
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add -- "${CLIENT}/XLS-2026Q4.xls"
          git diff --cached --quiet || git commit -m "feedback: ${{ github.event.client_payload.post_id }} -> ${{ github.event.client_payload.result }} (${CLIENT})"
          for attempt in 1 2 3 4 5; do
            if git push; then break; fi
            echo "XLS push rejected (attempt $attempt) -- rebasing..."
            git fetch origin main && git rebase origin/main
          done
          cd ..
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add XLS
          git diff --cached --quiet || git commit -m "feedback: update XLS submodule pointer (${CLIENT})"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then break; fi
            echo "parent push rejected (attempt $attempt) -- rebasing..."
            git fetch origin main && git rebase origin/main
          done
