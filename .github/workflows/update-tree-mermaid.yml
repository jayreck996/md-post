name: update-tree-mermaid

# Whenever either client's JSON tree changes on main, regenerates that client's
# Mermaid block and replaces it in all matching open issues.
# JSON path read from YML/{CLIENT}/YML-*.yml via pipeline_config.py.

on:
  workflow_dispatch: {}   # manual only — weekly schedule moved to jayreck996/JSON

permissions:
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [REDWOLF, ASIS]

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.JSON_PAT }}

      - name: Check out YML
        uses: actions/checkout@v4
        with:
          repository: jayreck996/YML
          ref: main
          path: YML
          fetch-depth: 0
          token: ${{ secrets.YML_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pyyaml
        run: pip install pyyaml -q

      - name: Load pipeline config
        id: cfg
        run: python3 .github/scripts/pipeline_config.py ${{ matrix.client }} update_tree_mermaid

      - name: Check out JSON
        if: ${{ contains(format(' {0} ', steps.cfg.outputs.shared_repos), ' JSON ') }}
        uses: actions/checkout@v4
        with:
          repository: jayreck996/JSON
          ref: main
          path: JSON
          fetch-depth: 0
          token: ${{ secrets.JSON_PAT }}

      - name: Check out XLS
        if: ${{ contains(format(' {0} ', steps.cfg.outputs.shared_repos), ' XLS ') }}
        uses: actions/checkout@v4
        with:
          repository: jayreck996/XLS
          ref: main
          path: XLS
          fetch-depth: 0
          token: ${{ secrets.XLS_PAT }}

      - name: Check out JSONL
        if: ${{ contains(format(' {0} ', steps.cfg.outputs.shared_repos), ' JSONL ') }}
        uses: actions/checkout@v4
        with:
          repository: jayreck996/JSONL
          ref: main
          path: JSONL
          fetch-depth: 0
          token: ${{ secrets.JSONL_PAT }}

      - name: Generate Mermaid block for ${{ matrix.client }}
        env:
          CLIENT: ${{ matrix.client }}
        run: python3 .github/scripts/gen_tree_mermaid.py > /tmp/mermaid.md

      - name: Update Mermaid section in open issues for ${{ matrix.client }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLIENT: ${{ matrix.client }}
          JSON_FILE: ${{ steps.cfg.outputs.json }}
        run: |
          ISSUE_NUMBERS=$(gh issue list --state open --json number,body \
            --jq ".[] | select(.body | contains(\"${JSON_FILE}\")) | .number")

          for ISSUE in $ISSUE_NUMBERS; do
            gh issue view "$ISSUE" --json body --jq '.body' > /tmp/issue_body.md

            if ! grep -qF '<!-- TREE-START -->' /tmp/issue_body.md; then
              continue
            fi

            python3 .github/scripts/replace_tree_section.py \
              /tmp/issue_body.md /tmp/mermaid.md > /tmp/updated_body.md

            gh issue edit "$ISSUE" --body-file /tmp/updated_body.md
            echo "[${CLIENT}] Updated issue #${ISSUE} Mermaid block."
          done
